<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | Smart Interview Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-page" role="main">
  <div class="auth-wrap" style="max-width:400px;grid-template-columns:1fr">
    <div class="auth-form" style="padding:50px 40px">
      <div style="text-align:center;margin-bottom:24px">
        <span style="font-size:40px">🔐</span>
        <h1 style="margin-top:12px;font-size:20px">Reset Password</h1>
        <p style="color:#71809f;font-size:12px">Enter your email and we'll send a reset link.</p>
      </div>

      <div id="successMsg" style="display:none;background:#e8faf4;border:1px solid #c0ead8;color:#13a87c;padding:12px;border-radius:6px;font-size:11px;text-align:center;margin-bottom:14px">
        ✅ Password reset email sent! Check your inbox.
      </div>
      <div id="errorMsg" style="display:none;background:#fef0f2;border:1px solid #f9d0d5;color:#b91c1c;padding:12px;border-radius:6px;font-size:11px;text-align:center;margin-bottom:14px"></div>

      <form id="resetForm" novalidate>
        <label class="field" for="resetEmail">
          Email address
          <input type="email" id="resetEmail" name="email" placeholder="you@example.com" required autocomplete="email">
        </label>
        <button class="btn full" type="submit" id="resetBtn" style="margin-top:14px">Send Reset Link</button>
      </form>

      <a class="auth-link" href="login.html" style="margin-top:20px">← Back to Sign In</a>
    </div>
  </div>
</main>

<script type="module">
  import { auth, sendPasswordResetEmail } from './js/supabase-config.js';

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('resetEmail').value.trim();
    const btn = document.getElementById('resetBtn');
    const success = document.getElementById('successMsg');
    const error = document.getElementById('errorMsg');
    success.style.display = 'none';
    error.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Sending…';

    try {
      await sendPasswordResetEmail(auth, email);
      success.style.display = 'block';
      document.getElementById('resetForm').reset();
    } catch (err) {
      const msgs = {
        'auth/user-not-found': 'No account found with this email.',
        'auth/invalid-email': 'Please enter a valid email address.',
      };
      error.textContent = msgs[err.code] || err.message;
      error.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
    }
  });
</script>
</body>
</html>
